stages:
  - install
  - lint_test
  - build
  - package
  - deploy

variables:
  NODE_VERSION: "20"
  IMAGE_NAME: "$DOCKERHUB_USER/company-devops"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/

install:
  stage: install
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  stage: lint_test
  image: node:${NODE_VERSION}-alpine
  needs: ["install"]
  script:
    - npm run lint

test:
  stage: lint_test
  image: node:${NODE_VERSION}-alpine
  needs: ["install"]
  script:
    - npm run test

build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  needs: ["lint", "test"]
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day

package:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  needs: ["build"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" -t "$IMAGE_NAME:latest" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
    - docker push "$IMAGE_NAME:latest"
  only:
    - main

deploy:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  needs: ["package"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USER" --password-stdin
  script:
    - docker pull "$IMAGE_NAME:latest"
    - docker rm -f company-devops-app || true
    - docker run -d --name company-devops-app -p 80:80 "$IMAGE_NAME:latest"
  environment:
    name: production
  only:
    - main

notify_success:
  stage: deploy
  image: alpine:3.20
  needs: ["deploy"]
  when: on_success
  script:
    - apk add --no-cache curl
    - >
      curl -X POST -H 'Content-type: application/json' --data "{
        \"text\": \"✅ *Pipeline réussi* pour *$CI_PROJECT_NAME*\n
        Branche: \`$CI_COMMIT_REF_NAME\`\n
        Commit: \`$CI_COMMIT_SHORT_SHA\` - $CI_COMMIT_TITLE\n
        Auteur: $GITLAB_USER_NAME\n
        Pipeline: $CI_PIPELINE_URL\"
      }" "$SLACK_WEBHOOK_URL"

notify_failure:
  stage: deploy
  image: alpine:3.20
  needs: []
  when: on_failure
  script:
    - apk add --no-cache curl
    - >
      curl -X POST -H 'Content-type: application/json' --data "{
        \"text\": \"❌ *Pipeline échoué* pour *$CI_PROJECT_NAME*\n
        Branche: \`$CI_COMMIT_REF_NAME\`\n
        Commit: \`$CI_COMMIT_SHORT_SHA\` - $CI_COMMIT_TITLE\n
        Auteur: $GITLAB_USER_NAME\n
        Pipeline: $CI_PIPELINE_URL\"
      }" "$SLACK_WEBHOOK_URL"
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: company-devops:local
    container_name: company-devops-app
    ports:
      - "8082:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3